<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0f1117"/>
  <g stroke-linecap="round" fill="none" stroke-width="5">
    <!-- three axes through the center: red / green / blue tubes -->
    <line x1="14.7" y1="22" x2="49.3" y2="42" stroke="#e53e3e"/>
    <line x1="14.7" y1="42" x2="49.3" y2="22" stroke="#3182ce"/>
    <line x1="32" y1="10" x2="32" y2="54" stroke="#38a169"/>
  </g>
  <!-- connector tips -->
  <g>
    <circle cx="14.7" cy="22" r="3.6" fill="#e53e3e"/>
    <circle cx="49.3" cy="42" r="3.6" fill="#e53e3e"/>
    <circle cx="14.7" cy="42" r="3.6" fill="#3182ce"/>
    <circle cx="49.3" cy="22" r="3.6" fill="#3182ce"/>
    <circle cx="32" cy="10" r="3.6" fill="#38a169"/>
    <circle cx="32" cy="54" r="3.6" fill="#38a169"/>
  </g>
  <!-- central connector node -->
  <circle cx="32" cy="32" r="7" fill="#f1f5f9" stroke="#0f1117" stroke-width="1.5"/>
</svg>
